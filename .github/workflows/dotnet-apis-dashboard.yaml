name: dotnet-apis-dashboard-build

on:
  push:
    branches:
      - main
    paths:
      - dotnet-apis-dashboard/**
      - .github/workflows/dotnet-apis-dashboard.yaml
  pull_request:
    paths:
      - dotnet-apis-dashboard/**
      - .github/workflows/dotnet-apis-dashboard.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: dotnet-apis-dashboard

    env:
      IMAGE_NAME: dotnet-apis-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dotnet-apis-dashboard
          file: ./dotnet-apis-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dotnet-apis-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/dotnet-apis-dashboard:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy .NET image to Azure Web App
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ vars.DOTNET_DASHBOARD_WEB_APP_NAME }}
          images: ghcr.io/${{ github.repository_owner }}/dotnet-apis-dashboard:${{ github.sha }}
