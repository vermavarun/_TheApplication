name: nextjs-dashboard-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - nextjs-dashboard/**
      - .github/workflows/nextjs-dashboard.yaml
  pull_request:
    paths:
      - nextjs-dashboard/**
      - .github/workflows/nextjs-dashboard.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: nextjs-dashboard

    env:
      IMAGE_NAME: nextjs-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextjs-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Archive build output
        run: |
          mkdir -p artifacts
          tar -czf artifacts/nextjs-dashboard-build.tar.gz .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-dashboard-build
          path: nextjs-dashboard/artifacts/nextjs-dashboard-build.tar.gz
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs-dashboard
          file: ./nextjs-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextjs-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/nextjs-dashboard:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Next.js image to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.NEXTJS_DASHBOARD_WEB_APP_NAME }}
          images: ghcr.io/${{ github.repository_owner }}/nextjs-dashboard:${{ github.sha }}

      - name: Set Next.js app settings in Azure Web App
        run: |
          az webapp config appsettings set \
            --resource-group "${{ vars.RESOURCE_GROUP_NAME }}" \
            --name "${{ vars.NEXTJS_DASHBOARD_WEB_APP_NAME }}" \
            --settings "API_BASE_URL=https://${{ vars.DOTNET_DASHBOARD_WEB_APP_NAME }}.azurewebsites.net"
