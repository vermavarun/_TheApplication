name: nextjs-dashboard-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: nextjs-dashboard

    env:
      IMAGE_NAME: nextjs-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextjs-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs-dashboard
          file: ./nextjs-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextjs-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/nextjs-dashboard:${{ github.sha }}

      - name: Archive build output
        run: |
          mkdir -p ../artifacts
          tar -czf ../artifacts/nextjs-dashboard-build.tar.gz .next

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-dashboard-build
          path: artifacts/nextjs-dashboard-build.tar.gz
          if-no-files-found: error
