# Prerequisites:
# 1) Resource group must already exist.
# 2) Managed identity must be configured for federated access to this repository.
# 3) That managed identity must have Contributor access on the target resource group.
# 4) Storage account with blob container named tfstate must already exist for remote Terraform state.
# 5) Repository variables and secrets must be configured for the Azure deployment values.

name: terraform-ai-mlops

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - azure-ai
    paths:
      - ai/azure/terraform/**
      - .github/workflows/terraform-ai-mlops.yaml

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ai/azure/terraform

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.MLOPS_RESOURCE_GROUP_NAME }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_environment: ${{ vars.MLOPS_ENVIRONMENT }}
      TF_VAR_project: ${{ vars.MLOPS_PROJECT }}
      TF_VAR_ml_workspace_name: ${{ vars.MLOPS_AML_WORKSPACE_NAME }}
      TF_VAR_storage_account_name: ${{ vars.MLOPS_STORAGE_ACCOUNT_NAME }}
      TF_VAR_storage_replication_type: ${{ vars.MLOPS_STORAGE_REPLICATION_TYPE }}
      TF_VAR_acr_name: ${{ vars.MLOPS_ACR_NAME }}
      TF_VAR_key_vault_name: ${{ vars.MLOPS_KEY_VAULT_NAME }}
      TF_VAR_log_analytics_workspace_name: ${{ vars.MLOPS_LOG_ANALYTICS_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY_MLOPS }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  destroy:
    needs: terraform
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ai/azure/terraform

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.MLOPS_RESOURCE_GROUP_NAME }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_environment: ${{ vars.MLOPS_ENVIRONMENT }}
      TF_VAR_project: ${{ vars.MLOPS_PROJECT }}
      TF_VAR_ml_workspace_name: ${{ vars.MLOPS_AML_WORKSPACE_NAME }}
      TF_VAR_storage_account_name: ${{ vars.MLOPS_STORAGE_ACCOUNT_NAME }}
      TF_VAR_storage_replication_type: ${{ vars.MLOPS_STORAGE_REPLICATION_TYPE }}
      TF_VAR_acr_name: ${{ vars.MLOPS_ACR_NAME }}
      TF_VAR_key_vault_name: ${{ vars.MLOPS_KEY_VAULT_NAME }}
      TF_VAR_log_analytics_workspace_name: ${{ vars.MLOPS_LOG_ANALYTICS_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY_MLOPS }}"

      - name: Terraform destroy
        run: terraform destroy -auto-approve
