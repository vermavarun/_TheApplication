# Prerequisites:
# 1) Resource group must already exist.
# 2) Managed identity must be configured for federated access to this repository.
# 3) That managed identity must have Contributor access on the target resource group.
# 4) Storage account with blob container named tfstate must already exist for remote Terraform state.
# 5) Repository variables and secrets must be configured for the Azure deployment values.

name: terraform-dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - terraform-dashboard/**
      - .github/workflows/terraform-dashboard.yaml

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform-dashboard

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_nextjs_web_app_name: ${{ vars.NEXTJS_DASHBOARD_WEB_APP_NAME }}
      TF_VAR_dotnet_web_app_name: ${{ vars.DOTNET_DASHBOARD_WEB_APP_NAME }}
      TF_VAR_service_plan_name: ${{ vars.AZURE_SERVICE_PLAN_NAME }}
      TF_VAR_sql_server_name: ${{ vars.SQL_SERVER_NAME }}
      TF_VAR_sql_database_name: ${{ vars.SQL_DATABASE_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  destroy:
    needs: terraform
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform-dashboard

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_nextjs_web_app_name: ${{ vars.NEXTJS_DASHBOARD_WEB_APP_NAME }}
      TF_VAR_dotnet_web_app_name: ${{ vars.DOTNET_DASHBOARD_WEB_APP_NAME }}
      TF_VAR_service_plan_name: ${{ vars.AZURE_SERVICE_PLAN_NAME }}
      TF_VAR_sql_server_name: ${{ vars.SQL_SERVER_NAME }}
      TF_VAR_sql_database_name: ${{ vars.SQL_DATABASE_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: Terraform destroy
        run: terraform destroy -auto-approve