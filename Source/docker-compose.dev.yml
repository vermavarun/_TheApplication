version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: sql-server-dev
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=Ggn@1234Ggn@1234
      - MSSQL_PID=Developer
      - MSSQL_USER=sa
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    networks:
      - app-network
    restart: unless-stopped

  # Identity API Service (Development)
  identity-api:
    build:
      context: ./identity
      dockerfile: Dockerfile
      target: build  # Use build stage for development
    container_name: identity-api-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__identitydb=Server=sqlserver,1433;Database=identitydb;User Id=sa;Password=Ggn@1234Ggn@1234;TrustServerCertificate=true;
      - Jwt__Key=ThisIsASecretKeyForJWTTokenGenerationThatShouldBeAtLeast32Characters
      - Jwt__Issuer=IdentityAPI
      - Jwt__Audience=IdentityAPI
    ports:
      - "5074:8080"
    depends_on:
      - sqlserver
    networks:
      - app-network
    volumes:
      - ./identity:/src
      - ./identity/Uploads:/app/Uploads
    command: ["dotnet", "watch", "run", "--project", "/src/identity.csproj", "--urls", "http://+:8080"]
    restart: unless-stopped

  # Next.js Frontend Application (Development)
  next-app:
    build:
      context: ./next-app
      dockerfile: Dockerfile
      target: deps  # Use deps stage for development
    container_name: next-app-dev
    environment:
      - NODE_ENV=development
      - API_URL=http://identity-api:8080
      - NEXT_PUBLIC_API_URL=http://localhost:5074
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    depends_on:
      - identity-api
    networks:
      - app-network
    volumes:
      - ./next-app:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_dev_data:
    driver: local
