$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: linear_regression_train
display_name: Train Model
version: "1"
type: command
code: ../src
environment: azureml:linear-regression-env@latest
inputs:
  dataset:
    type: uri_folder
outputs:
  model:
    type: uri_folder
command: >-
  python train.py --data-dir ${{inputs.dataset}} --model-dir ${{outputs.model}}
