services:
  nextjs-dashboard:
    build:
      context: ./nextjs-dashboard
      dockerfile: Dockerfile
    container_name: nextjs-dashboard
    environment:
      API_BASE_URL: http://dotnet-apis-dashboard:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - dotnet-apis-dashboard

  dotnet-apis-dashboard:
    build:
      context: ./dotnet-apis-dashboard
      dockerfile: Dockerfile
    container_name: dotnet-apis-dashboard
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ""
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver-data: